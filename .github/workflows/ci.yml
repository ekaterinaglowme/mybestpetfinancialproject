name: CI/CD

# Тесты гоняются ТОЛЬКО на PR в main. На push в main их нет — повторно гонять уже
# проверенный PR незачем. Гарантия «в main только зелёный код» держится на
# branch protection: PR нельзя смёржить, пока job Tests не зелёный.
# Деплой на виртуалку — только при push в main (после мёржа PR). На PR деплоя нет.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    if: github.event_name == 'pull_request'   # только на PR, не на push в main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  docker:
    name: Build Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # нужно, чтобы пушить образ в ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в реестр нужен только когда реально пушим (push в main); на PR — нет.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — теги и labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # На PR — только сборка (проверка, что Dockerfile собирается).
      # На push в main — сборка и публикация образа в ghcr.io.
      - name: Build (push только в main)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM
    needs: docker                    # тестов на main нет; ждём только сборку образа
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read                 # GITHUB_TOKEN сможет спуллить приватный образ из ghcr
    concurrency: deploy-production   # два деплоя одновременно не пойдут
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # На VM: логин в ghcr (эфемерный GITHUB_TOKEN) → pull свежего :latest →
      # пересоздание контейнера через docker run. Флаг --restart unless-stopped:
      # Docker сам поднимет контейнер после ребута/падения — systemd не нужен.
      # Если pull упадёт — старый контейнер не трогаем, он продолжит работать.
      - name: Pull image on VM and (re)start container
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && docker pull '${IMAGE}' \
             && { docker rm -f petbank 2>/dev/null || true; } \
             && docker run -d --restart unless-stopped --name petbank --memory=512m --cpus=0.5 -p 8000:8000 '${IMAGE}' \
             && sleep 10 \
             && curl -fsS http://127.0.0.1:8000/health \
             && docker image prune -f \
             && docker logout ghcr.io"
