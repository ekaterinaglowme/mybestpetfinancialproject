name: CI/CD

# На PR проверяем ВСЁ, что можем, не экономя время: юнит-тесты (job Tests),
# чёрно-ящичные интеграционные тесты на реальном Docker-стеке (job Integration)
# и сборку Docker-образа (job Build Docker image, без публикации). Цель — поймать
# невалидное изменение на этапе PR, а не после мёржа. На push в main тесты не
# гоняем повторно. Гарантия «в main только зелёный код» держится на branch
# protection: PR нельзя смёржить, пока обязательные jobs не зелёные.
# Деплой на виртуалку — только при push в main (после мёржа PR). На PR деплоя нет.
# На push в main порядок жёсткий: сначала job migrate (alembic upgrade head),
# и только после его успеха — job deploy (deploy: needs [docker, migrate]). Так
# новый контейнер никогда не поднимается на несмигрированной схеме. Миграция
# упала — деплой не пошёл, старый контейнер продолжает обслуживать трафик.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    if: github.event_name == 'pull_request'   # только на PR, не на push в main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  integration:
    name: Integration tests (black-box)
    if: github.event_name == 'pull_request'   # только на PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ubuntu-latest уже содержит Docker + docker compose v2. Тесты сами поднимут
      # стенд (Postgres + мок СтопЛиста + app из Dockerfile), накатят схему с хоста
      # и побьют по реальному HTTP. Каталог вне testpaths — указываем путь явно.
      - name: Run black-box integration tests
        run: pytest tests_blackbox/ -v

  docker:
    name: Build Docker image
    # На PR — только сборка (проверка, что Dockerfile собирается). На push в main —
    # сборка и публикация образа в ghcr.io.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # нужно, чтобы пушить образ в ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в реестр нужен только когда реально пушим (push в main); на PR — нет.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — теги и labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # На PR — только сборка (проверка, что Dockerfile собирается).
      # На push в main — сборка и публикация образа в ghcr.io.
      - name: Build (push только в main)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: DB migrate (alembic upgrade head)
    # Миграцию гоним ТОЛЬКО на push в main (после мёржа PR) — перед деплоем.
    # deploy: needs [docker, migrate], поэтому контейнер пересоздаётся строго
    # после успешной миграции. alembic upgrade head идемпотентен: если схема уже
    # на head — это no-op, гонять на каждый деплой безопасно.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: migrate-production   # две миграции параллельно не пойдут
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # DB_HOST/DB_PORT совпадают с теми, что deploy прокидывает в контейнер —
      # мигрируем ту же БД на VM. env.py берёт DSN из DB_* через db.build_dsn().
      - name: Run migrations
        env:
          DB_HOST: 212.147.238.3
          DB_PORT: "5432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
        run: alembic upgrade head

  deploy:
    name: Deploy to VM
    needs: [docker, migrate]         # деплой строго после сборки образа И миграции
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read                 # GITHUB_TOKEN сможет спуллить приватный образ из ghcr
    concurrency: deploy-production   # два деплоя одновременно не пойдут
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # На VM: логин в ghcr (эфемерный GITHUB_TOKEN) → pull свежего :latest →
      # пересоздание контейнера через docker run. Флаг --restart unless-stopped:
      # Docker сам поднимет контейнер после ребута/падения — systemd не нужен.
      # Если pull упадёт — старый контейнер не трогаем, он продолжит работать.
      - name: Pull image on VM and (re)start container
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && docker pull '${IMAGE}' \
             && { docker image prune -af 2>/dev/null || true; } \
             && { docker rm -f petbank 2>/dev/null || true; } \
             && docker network create petbank-net 2>/dev/null || true \
             && docker run -d --restart unless-stopped --name petbank \
                  --network petbank-net --memory=512m --cpus=0.5 -p 8000:8000 \
                  -e DB_HOST=212.147.238.3 -e DB_PORT=5432 \
                  -e DB_USER='${{ secrets.DB_USER }}' \
                  -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
                  -e DB_DATABASE='${{ secrets.DB_DATABASE }}' \
                  '${IMAGE}' \
             && sleep 10 \
             && curl -fsS http://127.0.0.1:8000/health \
             && curl -fsS http://127.0.0.1:8000/ready \
             && docker image prune -f \
             && docker logout ghcr.io"
