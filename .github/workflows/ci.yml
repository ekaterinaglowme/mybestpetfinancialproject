name: CI/CD

# Тесты гоняются на каждый PR в main и на каждый push в main.
# Деплой на виртуалку — только после зелёных тестов и только при push в main
# (то есть после мёржа PR). На самих PR деплоя нет.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  deploy:
    name: Deploy to VM
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production   # два деплоя одновременно не пойдут
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync code to /opt/petbank
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='deploy' \
            --exclude='__pycache__' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            ./ "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/opt/petbank/"

      - name: Restart service and verify
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            'sudo systemctl restart petbank && systemctl is-active --wait petbank && sleep 10 && curl -fsS http://127.0.0.1:8000/health'
